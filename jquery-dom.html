<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">  
        <title>Q3: Compare Native JavaScript and jQuery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <style>
            .myStyle {
                background-color: coral;
                padding: 16px;
            }
            body{font-family: Arial, sans-serif; margin: 40px;}
            div, button{margin-bottom: 15px;}
        </style>
    </head>

    <body>
        <div id="myElement">Original Text</div>
        
        <div id="myDIV">
            <p>I am a myDIV.</p>
        </div>
        
        <button id="myButton">Click me</button>

        <script>
            $(document).ready(function() {
                // (a) Replace text of #myElement with "Modified Text"
                $("#myElement").text("Modified Text");

                // (b) Add the myStyle class to #myDIV
                $("#myDIV").addClass("myStyle");

                // (c) Respond to a click on #myButton by showing an alert popup
                $("#myButton").on("click", function() {
                    alert("Button clicked!");
                });
            });
        </script>
    </body>
</html>
